[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lablr"
version = "0.2.0"
description = "Automatic point-label placement for Matplotlib using 2D signed distance fields and pairwise potentials."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["lablr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
